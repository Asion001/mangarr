<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- home screen app: draw under the status bar; pages pad by the safe-area insets -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1115" />
    <!-- Safari ignores SVG favicons: PNG and ICO fallbacks, a home screen icon and a manifest -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>mangarr</title>
    <!-- the last theme this browser showed, before the app loads (no dark flash on a light theme) -->
    <script>try{if(localStorage.getItem("mangarr:theme")==="light"){document.documentElement.classList.replace("dark","light");document.documentElement.style.colorScheme="light"}}catch(e){}</script>
    <!-- shown until the app's code has loaded and React replaces #root; plain CSS, the app's stylesheet isn't here yet -->
    <style>
      html{background:#0f1115;color-scheme:dark}
      html.light{background:#f6f7f9;color-scheme:light}
      .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;animation:boot-in .2s .15s forwards}
      .boot svg{width:24px;height:24px;color:#9aa2b1;animation:boot-spin 1s linear infinite}
      html.light .boot svg{color:#5b6472}
      @keyframes boot-in{to{opacity:1}}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body class="bg-bg text-fg">
    <div id="root"><div class="boot" role="status" aria-label="Loading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg></div></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
