# Example stack: mangarr + Suwayomi (extension engine) + FlareSolverr +
# Komga (serves the library to Mihon, Paperback, Panels, KOReader...).
#
# ghcr.io/asion001/mangarr:latest is one image for every role: the server
# (with a built-in upscaler when it gets a GPU) and workers
# (MANGARR_MODE=worker, e.g. on a desktop with a better GPU).
# ghcr.io/asion001/mangarr:slim is the server only (~40 MB).
#
#   docker compose -f docker/compose.example.yml up -d
#
# Keep the library on one mount per container so moves inside it are atomic.
# Run mangarr and Komga as the same user/group (here 1000:1000).

services:
  mangarr:
    image: ghcr.io/asion001/mangarr:latest
    container_name: mangarr
    user: "1000:1000"
    # Optional: upscale on the Intel/AMD iGPU with the built-in upscaler.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993" # the host's render group id: getent group render
    environment:
      TZ: Etc/UTC
      # Optional: keep upscaling and re-encoding out of this container and
      # let the mangarr-processing worker below do them (docs/setup.md,
      # "Processing in a separate container"):
      # MANGARR_MODE: server
      # MANGARR_PROCESSING: workers
      # SQLite by default; optional Postgres:
      # MANGARR_DB: postgres://mangarr:secret@db:5432/mangarr?sslmode=disable
      #
      # Optional: pin configuration so it can't drift (shown locked in the UI).
      # Every variable is listed in docs/configuration.md.
      # MANGARR_ROOT_FOLDERS: /data/manga/en
      # MANGARR_DOWNLOADS_MAX_PER_SOURCE: "1"
      # MANGARR_MODULE_SUWAYOMI_IMPL: source/suwayomi
      # MANGARR_MODULE_SUWAYOMI_URL: http://suwayomi:4567
      # MANGARR_MODULE_SUWAYOMI_FLARE_SOLVERR_ENABLED: "true"
      # MANGARR_MODULE_SUWAYOMI_FLARE_SOLVERR_URL: http://flaresolverr:8191
      # MANGARR_MODULE_ANILIST_IMPL: metadata/anilist
      # MANGARR_MODULE_KOMGA_IMPL: library/komga
      # MANGARR_MODULE_KOMGA_URL: http://komga:25600
      # MANGARR_MODULE_KOMGA_API_KEY: ${KOMGA_API_KEY}
      # MANGARR_MODULE_KOMGA_PATH_MAPPINGS: /data/manga=/data/manga
    volumes:
      - ./mangarr:/config
      - /data/storage/manga:/data/manga
    ports:
      - "8787:8787"
      # Komga-compatible API for Mihon, KMReader and Paperback (Settings →
      # Reading apps); 25601 on the host because Komga below uses 25600
      - "25601:25600"
    restart: unless-stopped
    depends_on: [suwayomi]

  # Optional: PostgreSQL. You don't need it to start — mangarr runs on SQLite
  # and System → Database moves the data over (and back) while it runs. Add
  # the service, then enter these details on that page; set MANGARR_DB above
  # only if you'd rather pin the address yourself.
  # db:
  #   image: postgres:17-alpine
  #   container_name: mangarr-db
  #   environment:
  #     POSTGRES_USER: mangarr
  #     POSTGRES_PASSWORD: secret
  #     POSTGRES_DB: mangarr
  #     TZ: Etc/UTC
  #   volumes:
  #     - ./postgres:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U mangarr"]
  #     interval: 10s
  #   restart: unless-stopped

  # Headless engine for Keiyoushi extensions. No published port and no access
  # to the library; mangarr manages its settings (updater off, FlareSolverr).
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2243 # tested version; mangarr warns on others
    container_name: suwayomi
    environment:
      TZ: Etc/UTC
      WEB_UI_ENABLED: "false"
      KCEF_ENABLED: "false" # enable only if a source you need requires WebView
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - ./suwayomi:/home/suwayomi/.local/share/Tachidesk
    mem_limit: 1g
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: Etc/UTC
    restart: unless-stopped

  komga:
    image: gotson/komga:latest
    container_name: komga
    user: "1000:1000"
    environment:
      TZ: Etc/UTC
    volumes:
      - ./komga:/config
      - /data/storage/manga:/data/manga:ro
    ports:
      - "25600:25600"
    restart: unless-stopped

  # Optional: a worker on another machine (or here, for a second GPU). It
  # asks mangarr for work, so it needs no port and no inbound access — it
  # only has to reach the server. Make its key in System → Workers and give
  # it the roles it should do there.
  # mangarr-worker:
  #   image: ghcr.io/asion001/mangarr:latest
  #   environment:
  #     MANGARR_MODE: worker
  #     MANGARR_SERVER_URL: http://mangarr:8787
  #     MANGARR_WORKER_KEY: ${MANGARR_WORKER_KEY}   # System → Workers
  #   devices:
  #     - /dev/dri:/dev/dri           # only needed for upscaling
  #   restart: unless-stopped

  # Optional: processing (resize, upscale, split, re-encode) in its own
  # container, so a GPU crash or a page that runs out of memory can't take
  # the server down. Set MANGARR_MODE=server and MANGARR_PROCESSING=workers on
  # mangarr above, and make a key with the Encode (and Upscale) roles in
  # System → Workers. It shares mangarr's data folder at the same path, so
  # pages are read and written in place instead of travelling over HTTP.
  # mangarr-processing:
  #   image: ghcr.io/asion001/mangarr:latest
  #   user: "1000:1000"                   # the same user as mangarr
  #   environment:
  #     TZ: Etc/UTC
  #     MANGARR_MODE: worker
  #     MANGARR_SERVER_URL: http://mangarr:8787
  #     MANGARR_WORKER_KEY: ${MANGARR_PROCESSING_KEY}   # System → Workers
  #     MANGARR_WORKER_ROLES: encode,upscale
  #     MANGARR_WORKER_SHARED_STORAGE: "true"
  #   volumes:
  #     - ./mangarr:/config               # the same folder as mangarr's /config
  #   devices:
  #     - /dev/dri:/dev/dri               # only needed for upscaling
  #   mem_limit: 4g
  #   restart: unless-stopped
  #   depends_on: [mangarr]
