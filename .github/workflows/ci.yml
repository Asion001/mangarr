name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: import lint (vendor clients only inside modules)
        run: ./scripts/import-lint.sh
      - name: test (SQLite + Postgres)
        env:
          MANGARR_TEST_POSTGRES: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: lint
        run: npm run lint --if-present
        working-directory: web
      - name: typecheck
        run: npm run typecheck
        working-directory: web
      - name: translations
        run: npm run check:i18n
        working-directory: web
      - name: unit tests
        run: npm test
        working-directory: web
      - name: production build
        run: npm run build
        working-directory: web
      - name: first-load bundle budget
        run: npm run check:bundle
        working-directory: web
      - name: install Chromium
        run: npm exec playwright install --with-deps chromium
        working-directory: web
      - name: browser tests
        run: npm run test:e2e
        working-directory: web
      - name: upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: regenerate OpenAPI schema
        run: |
          mkdir -p bin
          go build -o bin/mangarr ./cmd/mangarr
          ./bin/mangarr openapi > web/openapi.json
          npm run gen --prefix web
      - name: reject generated schema drift
        run: git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts

  images:
    needs: [test, web, generated]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # full image: every role (server, built-in upscaler, worker)
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
      - id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-slim,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=slim,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # slim image: distroless server only
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
