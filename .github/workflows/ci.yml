name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Stamped into every build (internal/version): where its worker zips are
# published, so the server can point workers at its own build. Each push
# publishes them on a prerelease of its own (worker-zips below).
env:
  UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/build-{build}/{zip}

# A push to main never cancels the run in progress: with pushes landing
# faster than a run takes, every run was cancelled and no image got
# published. The newest push waits instead (older waiting ones drop out).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: vet
        run: go vet ./...
      - name: import lint (vendor clients only inside modules)
        run: ./scripts/import-lint.sh
      - name: test (SQLite + Postgres)
        env:
          MANGARR_TEST_POSTGRES: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: lint
        run: npm run lint --if-present
        working-directory: web
      - name: typecheck
        run: npm run typecheck
        working-directory: web
      - name: translations
        run: npm run check:i18n
        working-directory: web
      - name: unit tests
        run: npm test
        working-directory: web
      - name: production build
        run: npm run build
        working-directory: web
      - name: first-load bundle budget
        run: npm run check:bundle
        working-directory: web
      - name: install Chromium
        run: npm exec playwright install --with-deps chromium
        working-directory: web
      - name: browser tests
        run: npm run test:e2e
        working-directory: web
      - name: upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: regenerate OpenAPI schema
        run: |
          mkdir -p bin
          go build -o bin/mangarr ./cmd/mangarr
          ./bin/mangarr openapi > web/openapi.json
          npm run gen --prefix web
      - name: reject generated schema drift
        run: git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts

  # the desktop worker: mangarr-worker with the upscalers, one zip per
  # platform (docs/setup.md, "A worker on a desktop"); attached to the
  # release on a tag, kept as the run's artifacts otherwise
  worker-zips:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [windows-amd64, darwin-arm64, linux-amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/worker-zip.sh "${TARGET%-*}" "${TARGET#*-}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: mangarr-worker-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          retention-days: 30
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes || true
          gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber
      # every push's zips, public and checksummed, for workers updating to
      # the server's build (internal/workerupdate); old ones are pruned
      - name: publish for worker updates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          REF: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }} ($REF)" \
            --notes "Worker zips of CI run ${{ github.run_number }} ($REF, $GITHUB_SHA), fetched by workers that update themselves to this build. Removed once 30 newer builds exist." || true
          gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber

  # a v* tag: the GitHub release, with notes from the conventional commits
  # since the previous tag, and the server and worker binaries with
  # checksums (the worker zips with upscalers are attached by worker-zips)
  release:
    needs: [test, web, generated]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        run: npm ci && npm run build
        working-directory: web
      - name: binaries
        env:
          VERSION: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} make build build-worker
            for bin in mangarr mangarr-worker; do
              mv "bin/$bin" "dist/$bin-${target%/*}-${target#*/}"
            done
          done
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            ext=; [ "${target%/*}" = windows ] && ext=.exe
            GOOS=${target%/*} GOARCH=${target#*/} make build-worker
            mv bin/mangarr-worker "dist/mangarr-worker-${target%/*}-${target#*/}$ext"
          done
          cd dist && sha256sum -- * > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-notes.sh "$TAG" > notes.md
          prerelease=; case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease ||
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber

  # keep the newest 30 per-build prereleases
  prune-builds:
    needs: [worker-zips]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[30:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

  images:
    needs: [test, web, generated]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # full image: every role (server, built-in upscaler, worker)
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
            UPDATE_URL=${{ env.UPDATE_URL }}
            IMAGE=${{ env.IMAGE }}
      - id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-slim,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=slim,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # slim image: distroless server only
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
            UPDATE_URL=${{ env.UPDATE_URL }}
            IMAGE=${{ env.IMAGE }}
